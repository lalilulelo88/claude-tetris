<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <script>
    try { document.documentElement.dataset.theme = localStorage.getItem('theme') === 'light' ? 'light' : 'dark'; }
    catch (e) { document.documentElement.dataset.theme = 'dark'; }
  </script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <button id="theme-toggle" class="theme-toggle" role="switch" aria-checked="false" aria-label="Modo claro">
      <span>Modo claro</span><span class="track"></span>
    </button>
    <h1 class="title">THETRIS</h1>

    <div class="game-container">
      <aside class="panel panel-left">
        <div class="panel-section">
          <label class="label" for="mode-select">MODO</label>
          <select id="mode-select">
            <option value="classic">Clásico</option>
            <option value="sprint">Sprint: 40 líneas en 2:00</option>
            <option value="garbage">Basura cada 10s</option>
            <option value="preset">Bloques pre-colocados</option>
            <option value="invisible">Piezas invisibles</option>
            <option value="inverse">Rotación inversa (nivel 5)</option>
          </select>
          <span class="hint" id="mode-info"></span>
        </div>
        <div class="panel-section">
          <span class="label">HOLD</span>
          <canvas id="hold-canvas" width="120" height="120"></canvas>
        </div>
        <div class="panel-section">
          <span class="label">COMBO</span>
          <span class="value" id="combo">-</span>
        </div>
        <div class="panel-section">
          <span class="label">ENERGÍA</span>
          <div class="energy"><div id="energy-fill"></div></div>
          <span class="hint" id="energy-hint"></span>
        </div>
        <div class="panel-section" id="peek-section" hidden>
          <span class="label">PRÓXIMAS</span>
          <canvas id="peek-canvas" width="70" height="210"></canvas>
        </div>
      </aside>

      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>C</kbd><kbd>Shift</kbd> reservar</li>
            <li><kbd>Q</kbd> habilidad</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>

      <div id="ability-menu" class="overlay hidden">
        <div class="overlay-box">
          <p class="menu-title">HABILIDAD</p>
          <button class="menu-btn" data-ability="peek"><kbd>1</kbd> Ver 5 siguientes (10s)</button>
          <button class="menu-btn" data-ability="swap"><kbd>2</kbd> Cambiar pieza actual</button>
          <button class="menu-btn" data-ability="slow"><kbd>3</kbd> Ralentizar (10s)</button>
          <button class="menu-btn" data-ability="undo"><kbd>4</kbd> Deshacer colocación</button>
          <button class="menu-btn" data-ability="hold"><kbd>5</kbd> Reserva extra</button>
          <button class="menu-btn" data-cancel><kbd>Esc</kbd> Cancelar</button>
        </div>
      </div>

      <div id="overlay" class="overlay hidden">
        <div class="overlay-box">
          <p id="overlay-title">GAME OVER</p>
          <p id="overlay-score"></p>
          <button id="restart-btn">Reiniciar</button>
        </div>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
